<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 680" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
  </defs>
  <rect width="1190" height="680" fill="#ffffff"/>
  <text x="30" y="36" font-size="22" font-weight="700" fill="#0f172a">ShopSmart staging deployment</text>
  <text x="30" y="60" fill="#475569">Solid arrows: HTTPS over the public internet. Dashed arrows: private connection inside the host's network (or TLS when the DB is on another provider).</text>

  <!-- Browser -->
  <rect x="30" y="250" width="190" height="120" rx="12" fill="#f1f5f9" stroke="#334155"/>
  <text x="125" y="280" text-anchor="middle" font-weight="700" fill="#0f172a">Browser</text>
  <text x="125" y="304" text-anchor="middle" fill="#334155">Evaluator / team</text>
  <text x="125" y="324" text-anchor="middle" fill="#334155">(staging access only)</text>
  <text x="125" y="350" text-anchor="middle" fill="#64748b" font-size="12">No secrets live here</text>

  <!-- Frontend -->
  <rect x="330" y="90" width="340" height="180" rx="12" fill="#ecfeff" stroke="#0e7490"/>
  <text x="500" y="118" text-anchor="middle" font-weight="700" fill="#0f172a">Hosted frontend (static site)</text>
  <text x="500" y="140" text-anchor="middle" fill="#334155">Vite build output: frontend/dist</text>
  <text x="500" y="160" text-anchor="middle" fill="#334155">https://shopsmart-web-&lt;team&gt;.example</text>
  <text x="345" y="192" fill="#0e7490" font-weight="700">Build-time config (PUBLIC):</text>
  <text x="345" y="212" fill="#0f172a" font-family="Consolas, monospace" font-size="13">VITE_API_URL=https://&lt;api-host&gt;/api</text>
  <text x="345" y="236" fill="#64748b" font-size="12">Bundled into the JavaScript the browser</text>
  <text x="345" y="252" fill="#64748b" font-size="12">downloads, so never a key or password.</text>

  <!-- API -->
  <rect x="330" y="330" width="360" height="310" rx="12" fill="#f0fdf4" stroke="#15803d"/>
  <text x="510" y="358" text-anchor="middle" font-weight="700" fill="#0f172a">Express API (Node 22 web service)</text>
  <text x="510" y="380" text-anchor="middle" fill="#334155">https://shopsmart-api-&lt;team&gt;.example</text>
  <text x="510" y="400" text-anchor="middle" fill="#334155">Health check: GET /api/health</text>
  <text x="345" y="430" fill="#15803d" font-weight="700">Runtime config (SERVER SECRETS):</text>
  <text x="345" y="452" fill="#0f172a" font-family="Consolas, monospace" font-size="13">DATABASE_URL=postgresql://… (secret)</text>
  <text x="345" y="472" fill="#0f172a" font-family="Consolas, monospace" font-size="13">GEMINI_API_KEY=… (secret)</text>
  <text x="345" y="492" fill="#0f172a" font-family="Consolas, monospace" font-size="13">FRONTEND_URL=https://&lt;web-host&gt;</text>
  <text x="345" y="512" fill="#0f172a" font-family="Consolas, monospace" font-size="13">NODE_ENV=production   PORT=(host)</text>
  <text x="345" y="532" fill="#0f172a" font-family="Consolas, monospace" font-size="13">AI_PROVIDER, GEMINI_MODEL,</text>
  <text x="345" y="552" fill="#0f172a" font-family="Consolas, monospace" font-size="13">AI_TIMEOUT_MS, GEMINI_THINKING_LEVEL</text>
  <text x="345" y="584" fill="#64748b" font-size="12">CORS allows only FRONTEND_URL.</text><text x="345" y="602" fill="#64748b" font-size="12">Pre-deploy step: npx prisma migrate deploy</text><text x="345" y="620" fill="#64748b" font-size="12">Never: db:migrate (migrate dev) or db:seed</text>

  <!-- DB -->
  <rect x="820" y="440" width="340" height="200" rx="12" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="990" y="468" text-anchor="middle" font-weight="700" fill="#0f172a">Managed PostgreSQL 16+</text>
  <text x="990" y="492" text-anchor="middle" fill="#334155">Tables: Product, Order, OrderItem,</text>
  <text x="990" y="512" text-anchor="middle" fill="#334155">_prisma_migrations</text>
  <text x="835" y="542" fill="#1d4ed8" font-weight="700">Config:</text>
  <text x="835" y="562" fill="#334155" font-size="13">Not publicly reachable if possible;</text>
  <text x="835" y="580" fill="#334155" font-size="13">app user (not superuser); daily backup;</text>
  <text x="835" y="598" fill="#334155" font-size="13">fictional data only</text>

  <!-- AI provider -->
  <rect x="820" y="130" width="340" height="170" rx="12" fill="#fffbeb" stroke="#b45309" stroke-dasharray="6 4"/>
  <text x="990" y="158" text-anchor="middle" font-weight="700" fill="#0f172a">Google Gemini API (optional)</text>
  <text x="990" y="180" text-anchor="middle" fill="#334155">generativelanguage.googleapis.com</text>
  <text x="835" y="210" fill="#334155" font-size="13">Called only by the API server, with the</text>
  <text x="835" y="228" fill="#334155" font-size="13">key in a request header. Receives at most</text>
  <text x="835" y="246" fill="#334155" font-size="13">3 public product facts + the question.</text>
  <text x="835" y="264" fill="#334155" font-size="13">If it fails, the assistant falls back to</text><text x="835" y="282" fill="#334155" font-size="13">catalog rules (tested).</text>

  <!-- arrows -->
  <line x1="220" y1="285" x2="328" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="30" y="215" fill="#334155" font-size="12">1. HTTPS: HTML/JS/CSS</text>
  <line x1="220" y1="335" x2="328" y2="430" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="30" y="400" fill="#334155" font-size="12">2. HTTPS: fetch /api/*</text>
  <text x="30" y="416" fill="#334155" font-size="12">(CORS: Origin = FRONTEND_URL)</text>
  <line x1="690" y1="530" x2="818" y2="530" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <text x="698" y="520" fill="#1d4ed8" font-size="12">3. Prisma over TLS</text>
  <text x="698" y="550" fill="#1d4ed8" font-size="12">(private network)</text>
  <line x1="690" y1="380" x2="818" y2="250" stroke="#b45309" stroke-width="2" marker-end="url(#ad)"/>
  <text x="700" y="410" fill="#b45309" font-size="12">4. HTTPS (internet)</text>
  <text x="700" y="426" fill="#b45309" font-size="12">x-goog-api-key header</text>
</svg>
